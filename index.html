<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WB Sale Data</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WB Sale">
    <link rel="apple-touch-icon" href="logo.png">

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { background-color: #0f172a; color: #f8fafc; font-family: Calibri, 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; }
        
        .auth-card { max-width: 380px; margin: 50px auto; background: rgba(30, 41, 59, 0.95); padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .auth-logo { width: 80px; margin-bottom: 12px; }
        input, select { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 8px; border-radius: 8px; margin-bottom: 6px; font-size: 13px; font-family: Calibri, sans-serif; }
        
        .btn { border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; color: white; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
        .btn-blue { background: #2563eb; }
        .btn-green { background: #10b981; }
        .btn-red { background: #ef4444; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .user-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .user-badge { font-size: 11px; text-align: right; }
        .sync-badge { font-size: 11px; font-weight: bold; color: #10b981; }
        .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
        .grid-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
        
        .tab-bar { display: flex; gap: 6px; border-bottom: 2px solid #334155; margin-bottom: 10px; overflow-x: auto; flex-wrap: wrap; }
        .tab-btn { background: none; border: none; color: #ef4444; font-size: 13.5px; font-weight: 600; padding: 6px 10px; cursor: pointer; }
        .tab-btn.active { border-bottom: 3px solid #ef4444; font-weight: 700; }
        .sub-tab-bar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .sub-tab-btn { background: #1e293b; border: 1px solid #475569; color: #94a3b8; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .sub-tab-btn.active { background: #3b82f6; color: #ffffff; border-color: #3b82f6; }
        
        .zoom-container { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: #94a3b8; }
        .table-wrapper { width: 100%; overflow-x: auto; background: #ffffff; border: 1px solid #d3d3d3; border-radius: 4px; margin-bottom: 15px; }
        .custom-table { width: 100%; border-collapse: collapse; background: #ffffff; color: #000000; font-size: 13px; font-family: Calibri, sans-serif; }
        .custom-table th, .custom-table td { border: 1px solid #d3d3d3; padding: 5px 7px; text-align: center; white-space: nowrap; }
        .custom-table th { background: #D9E1F2; font-weight: 700; }
        .subtotal-row { font-weight: bold; background-color: #F2F2F2; text-align: left; }
        .grand-total-row { background-color: #D9E1F2; font-weight: bold; }
        .highlight-green { background-color: #def7ec !important; color: #03543f !important; font-weight: bold; }
        .highlight-red { background-color: #fde8e8 !important; color: #9b1c1c !important; font-weight: bold; }
        .error-msg { color: #f87171; font-size: 12px; margin-top: 6px; }
        .custom-table th:first-child, .custom-table td:first-child { position: sticky; left: 0; z-index: 2; background-color: #F2F2F2; border-right: 1px solid #d3d3d3; text-align: left; padding-left: 6px; }
        .custom-table th:first-child { background-color: #D9E1F2; z-index: 3; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="authScreen" class="auth-card">
        <img src="logo.png" class="auth-logo" alt="Logo" onerror="this.style.display='none'">
        <h2>Welcome Back</h2>
        <p style="color: #94a3b8; font-size: 13px;">Sign in to access WB Sale Data Dashboard</p>
        <input type="text" id="loginUser" placeholder="Enter User ID">
        <input type="password" id="loginPass" placeholder="Enter Password">
        <button class="btn btn-blue" style="width: 100%; margin-top: 6px;" onclick="handleLogin()">Sign In</button>
        <button class="btn btn-green" style="width: 100%; margin-top: 10px;" onclick="syncAllDataFromCloud(true)">🔄 Sync Cloud Data</button>
        <div id="loginErr" class="error-msg"></div>
    </div>

    <!-- 2. MAIN APP SCREEN -->
    <div id="appScreen" style="display: none;">
        <div class="header-bar">
            <div>
                <h3 style="margin:0; font-size:19px;">WB Sale Data</h3>
                <span id="syncIndicator" class="sync-badge">● Ready Offline</span>
                <span id="syncedDateDisplay" style="font-size: 11px; color: #94a3b8; margin-left: 8px;"></span>
            </div>
            <div class="user-actions">
                <button class="btn btn-green" onclick="syncAllDataFromCloud(false)">🔄 Sync Cloud</button>
                <div class="user-badge" id="userBadge">👤 <b id="uName">User</b><br><span id="uRole" style="color: #60a5fa;">Role</span></div>
                <button class="btn btn-red" onclick="handleLogout()">Logout</button>
            </div>
        </div>

        <!-- CASCADING FILTERS -->
        <div class="card">
            <h4 style="margin: 0 0 8px 0;">🔍 Filters</h4>
            <div class="grid-filters">
                <div><label>Group Filter</label><select id="selGroup" onchange="onGroupChange()"></select></div>
                <div><label>ASM Filter</label><select id="selASM" onchange="onASMChange()"></select></div>
                <div><label>TSE Filter</label><select id="selTSE" onchange="onTSEChange()"></select></div>
                <div><label>LIC No Filter</label><select id="selLIC" onchange="onLICChange()"></select></div>
                <div><label>Outlet Filter</label><select id="selOutlet" onchange="onOutletChange()"></select></div>
            </div>
            <div style="margin-top: 8px;">
                <label>🔍 Instant Search (Outlet Name or LIC No):</label>
                <input type="text" id="searchFilter" placeholder="Type to search..." oninput="updateUI()">
            </div>
        </div>

        <!-- MAIN TABS -->
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('tabVol')">📦 Volume</button>
            <button class="tab-btn" onclick="switchTab('tabMS')">📈 Ms%</button>
            <button class="tab-btn" onclick="switchTab('tabDash')">📊 Dashboard</button>
            <button class="tab-btn" onclick="switchTab('tabAsk')">💬 Ask Assistant</button>
        </div>

        <!-- ZOOM SLIDER -->
        <div class="zoom-container">
            <span>🔍 Zoom Table:</span>
            <input type="range" id="zoomSlider" min="80" max="150" value="100" step="5" oninput="applyZoom(this.value)">
            <span id="zoomVal">100%</span>
        </div>

        <!-- TAB 1: VOLUME -->
        <div id="tabVol">
            <div class="table-wrapper zoom-target">
                <table class="custom-table" id="tableVolume">
                    <thead>
                        <tr><th>Brand</th><th>LM</th><th>TGT</th><th>TM</th><th>BAL</th></tr>
                    </thead>
                    <tbody id="bodyVolume"></tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: MS% -->
        <div id="tabMS" style="display: none;">
            <div class="table-wrapper zoom-target">
                <table class="custom-table" id="tableMS">
                    <thead>
                        <tr><th>Brand</th><th>LM</th><th>TM</th><th>GRW</th></tr>
                    </thead>
                    <tbody id="bodyMS"></tbody>
                </table>
            </div>
        </div>

        <!-- TAB 3: DASHBOARDS (H1, H2, H3) -->
        <div id="tabDash" style="display: none;">
            <div class="sub-tab-bar">
                <button class="sub-tab-btn active" onclick="switchSubTab('subTarget')">Target vs Ach</button>
                <button class="sub-tab-btn" onclick="switchSubTab('subMSDetails')">MS% Details</button>
                <button class="sub-tab-btn" onclick="switchSubTab('subWODDetails')">WOD Details</button>
            </div>
            <div id="subTarget"><div class="table-wrapper zoom-target"><table class="custom-table" id="tableH1"></table></div></div>
            <div id="subMSDetails" style="display: none;"><div class="table-wrapper zoom-target"><table class="custom-table" id="tableH2"></table></div></div>
            <div id="subWODDetails" style="display: none;"><div class="table-wrapper zoom-target"><table class="custom-table" id="tableH3"></table></div></div>
        </div>

        <!-- TAB 4: ASK ASSISTANT -->
        <div id="tabAsk" style="display: none;">
            <div class="card">
                <div class="grid-filters">
                    <div>
                        <label>Basis on Period:</label>
                        <select id="basisPeriod" onchange="runAskAssistant()">
                            <option value="TM">This Month (TM)</option>
                            <option value="LM" selected>Last Month (LM)</option>
                        </select>
                    </div>
                    <div>
                        <label>Target Brand Focus:</label>
                        <select id="targetBrandFocus" onchange="runAskAssistant()">
                            <option>IBDC</option>
                            <option>MHW</option>
                            <option>MHFB</option>
                            <option>BLGLM+BLGOR</option>
                            <option>SMG+SMGP</option>
                            <option>SIW</option>
                            <option>Monarch</option>
                        </select>
                    </div>
                    <div style="grid-column: span 2;">
                        <label>Choose a Query / Analysis:</label>
                        <select id="askQuery" onchange="runAskAssistant()">
                            <option value="TIL Non Billed Outlets">TIL Non Billed Outlets</option>
                            <option value="Deluxe Industry >= 30 CS but IBDC Not Billed">Deluxe Industry >= 30 CS but IBDC Not Billed</option>
                            <option value="Semi Premium Whisky Industry >= 50 CS but MHW Not Billed">Semi Premium Whisky Industry >= 50 CS but MHW Not Billed</option>
                            <option value="Magic Moments Billed but BLG Not Billed">Magic Moments Billed but BLG Not Billed</option>
                            <option value="MCD Lux Billed but IBDC Not Billed">MCD Lux Billed but IBDC Not Billed</option>
                            <option value="IQ Billed but IBDC Not Billed">IQ Billed but IBDC Not Billed</option>
                            <option value="RSW Billed but MHW Not Billed">RSW Billed but MHW Not Billed</option>
                            <option value="RGW Billed but MHW Not Billed">RGW Billed but MHW Not Billed</option>
                            <option value="SRB7 Billed but MHW Not Billed">SRB7 Billed but MHW Not Billed</option>
                            <option value="RCW Billed but MHW Not Billed">RCW Billed but MHW Not Billed</option>
                            <option value="All Season Billed but MHW Not Billed">All Season Billed but MHW Not Billed</option>
                            <option value="SMG + SMGP Lapsed Outlets">SMG + SMGP Lapsed Outlets</option>
                            <option value="SIW Lapsed Outlets">SIW Lapsed Outlets</option>
                            <option value="Brand-wise L3M Daily Run vs Current Month Daily Run">Brand-wise L3M Daily Run vs Current Month Daily Run</option>
                            <option value="Deluxe Industry - MS% Trend">Deluxe Industry - MS% Trend (6 Months)</option>
                            <option value="Semi Premium Whisky Industry - MS% Trend">Semi Premium Whisky Industry - MS% Trend (6 Months)</option>
                        </select>
                    </div>
                </div>
                <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
                    <span id="queryResultCount" style="font-size: 12.5px; font-weight: bold; color: #60a5fa;"></span>
                    <button class="btn btn-blue" onclick="downloadAskReportExcel()">📥 Download Report in Excel</button>
                </div>
            </div>
            <div class="table-wrapper zoom-target"><table class="custom-table" id="askTable"></table></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
