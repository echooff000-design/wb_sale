name: Auto Sync SharePoint Data

on:
  schedule:
    - cron: '0 * * * *' # Hourly auto-sync
  workflow_dispatch:     # Manual trigger support
  push:
    branches: [ main, master ]

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for Chromium
        run: sudo npx playwright install-deps chromium

      - name: Install Playwright Engine
        run: |
          pip install playwright
          playwright install chromium

      - name: Download Valid Excel Binary via Headless Browser
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time, os

          url = 'https://tilaknagarindustries-my.sharepoint.com/:x:/g/personal/andebnath_tilind_com/IQBQOO7YAaZLQIlMbx55OXr1AdvPSbB0XsQEEmRvQMvFdBY?download=1'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()

              print('Navigating to SharePoint link and handling redirects...')
              with page.expect_download(timeout=90000) as download_info:
                  try:
                      page.goto(url)
                  except Exception:
                      pass
              
              download = download_info.value
              print(f'Syncing complete. Suggested filename: {download.suggested_filename}')
              download.save_as('data.xlsx')
              browser.close()

          # Verify the file is binary and larger than 25KB (likely valid Excel)
          size = os.path.getsize('data.xlsx')
          print(f'Saved data.xlsx ({size} bytes).')
          if size < 25000:
              print('ERROR: Downloaded file is too small, likely an HTML error page.')
              raise ValueError('Downloaded file is not valid Excel.')
          "

      - name: Commit and Push Valid Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.xlsx
          git diff-index --quiet HEAD || (git commit -m "Auto-synced valid live SharePoint Excel binary" && git push origin main)
