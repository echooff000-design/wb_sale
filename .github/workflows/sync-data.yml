name: Auto Sync SharePoint Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright Engine
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Download Real Excel Binary via Headless Browser
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time, os

          url = 'https://tilaknagarindustries-my.sharepoint.com/:x:/g/personal/andebnath_tilind_com/IQBQOO7YAaZLQIlMbx55OXr1AdvPSbB0XsQEEmRvQMvFdBY?download=1'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              page = context.new_page()

              print('Navigating to SharePoint link...')
              with page.expect_download(timeout=90000) as download_info:
                  try:
                      page.goto(url)
                  except Exception as e:
                      pass
              
              download = download_info.value
              download.save_as('data.xlsx')
              browser.close()

          size = os.path.getsize('data.xlsx')
          print(f'Successfully downloaded genuine Excel file: {size} bytes')
          if size < 20000:
              raise ValueError('Downloaded file is too small, likely an HTML error page.')
          "

      - name: Commit and Push Valid Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.xlsx
          git diff-index --quiet HEAD || (git commit -m "Auto-synced valid live SharePoint Excel binary" && git push origin main)
