name: Auto Sync SharePoint Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Download Real Excel File from SharePoint
        run: |
          python -c "
          import requests
          import re
          from bs4 import BeautifulSoup

          url = 'https://tilaknagarindustries-my.sharepoint.com/:x:/g/personal/andebnath_tilind_com/IQBQOO7YAaZLQIlMbx55OXr1AdvPSbB0XsQEEmRvQMvFdBY?download=1'
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          })

          resp = session.get(url, allow_redirects=True)

          # If SharePoint returned an intermediate HTML redirect page, extract the true download URL
          if b'<!DOCTYPE html>' in resp.content[:200] or b'<html' in resp.content[:200]:
              print('SharePoint returned redirect page. Resolving direct binary URL...')
              match = re.search(r'\"downloadUrl\":\s*\"([^\"]+)\"', resp.text)
              if match:
                  direct_url = match.group(1).replace('\\u0026', '&')
                  resp = session.get(direct_url, allow_redirects=True)
              else:
                  # Alternative fallback: look for download form/action
                  soup = BeautifulSoup(resp.text, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      if 'download.aspx' in a['href']:
                          resp = session.get(a['href'], allow_redirects=True)
                          break

          # Verify the downloaded payload is a valid binary Excel/ZIP file
          if resp.content[:2] in [b'PK', b'\xd0\xcf'] or len(resp.content) > 50000:
              with open('data.xlsx', 'wb') as f:
                  f.write(resp.content)
              print(f'Successfully downloaded genuine Excel binary ({len(resp.content)} bytes).')
          else:
              print('ERROR: SharePoint response is not an Excel file:')
              print(resp.text[:500])
              raise ValueError('Downloaded file is not valid Excel.')
          "

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.xlsx
          git diff-index --quiet HEAD || (git commit -m "Auto-synced genuine live SharePoint data" && git push origin main)
