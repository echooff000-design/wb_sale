name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets & Initialize Capacitor
        run: |
          mkdir -p www
          cp -r index.html style.css app.js manifest.json sw.js logo.png www/ 2>/dev/null || cp index.html style.css app.js www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "WB Sale Data" "com.wbsale.dashboard" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WBSaleData-Installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
